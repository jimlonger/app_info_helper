name: app_info_helper
description: Unified native app, device, locale, timezone, and identifier information for Flutter apps on iOS and Android.
version: 0.1.2
homepage: https://github.com/jimlonger/app_info_helper
repository: https://github.com/jimlonger/app_info_helper
issue_tracker: https://github.com/jimlonger/app_info_helper/issues

environment:
  sdk: '>=3.3.0 <4.0.0'
  flutter: '>=3.19.0'

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

topics:
  - app-info
  - device-info
  - locale
  - advertising-id
  - identifiers

flutter:
  plugin:
    platforms:
      android:
        package: com.hearbaby.app_info_helper
        pluginClass: AppInfoHelperPlugin
      ios:
        pluginClass: AppInfoHelperPlugin
